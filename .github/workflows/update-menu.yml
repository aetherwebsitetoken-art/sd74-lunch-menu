name: Update lunch menu

on:
  schedule:
    # 10:00 and 22:00 UTC (roughly 5am and 5pm Central). Menus change far
    # less often than game scores, so twice a day is plenty.
    - cron: "0 10,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repo
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Fetch menu
        run: python3 fetch_menu.py

      - name: Commit updated menu (if it changed)
        # Runs even if the fetch step failed: the fetcher still refreshes
        # index.html from the last good data, and that should be saved.
        # (If nothing changed, nothing is committed.)
        if: success() || failure()
        id: commit
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          # embed.html is the paste-ready page for Google Sites. The fetcher
          # builds it from the index.html template on every run; index.html
          # itself is never modified by the bot.
          git add menu.json embed.html week-embed.html
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes"
          else
            git commit -m "Auto-update lunch menu"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Refresh jsDelivr CDN cache
        if: steps.commit.outputs.changed == 'true'
        run: |
          # Purging the instant the push lands is a race: if jsDelivr re-reads
          # the file before GitHub has finished publishing the new commit, it
          # caches the OLD copy again -- for up to 12 hours. So wait for GitHub
          # first, purge, then purge once more a little later to catch any
          # edge that refilled early.
          REPO="${GITHUB_REPOSITORY}"
          sleep 30
          for pass in 1 2; do
            for f in menu.json embed.html week-embed.html; do
              curl -s -o /dev/null -w "purge $f (pass $pass): HTTP %{http_code}\n" \
                "https://purge.jsdelivr.net/gh/${REPO}@main/$f" || true
            done
            if [ "$pass" = 1 ]; then sleep 45; fi
          done
