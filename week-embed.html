<title>SD74 Lunch — This week</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box}
  :root{
    --font:'Lexend',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --bg:#1c1c1f; --panel:#25252a; --panel-2:#2e2e34; --line:#3b3b42;
    --red:#d42a3c; --red-dark:#9c1426; --ink:#f5f5f3; --muted:#a8a8b1;
    --ease:cubic-bezier(.22,.8,.26,1);
  }
  /* No page background: only the rounded card shows inside the embed box. */
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;color:var(--ink);
    font-family:var(--font);-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  button{font-family:inherit;color:inherit;-webkit-tap-highlight-color:transparent}
  button:focus-visible{outline:3px solid var(--red);outline-offset:2px}
  /* Scaled by JS to fit the embed box exactly, so it never scrolls. */
  #fit{position:absolute;top:0;left:0;transform-origin:top left}
  .wrap{max-width:1040px;margin:0 auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}

  /* A column, so the card can be grown to the height of the embed box and
     the week still sits as a block of boxes rather than stretching. */
  .shell{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;
    display:flex;flex-direction:column;
    animation:cardIn .45s var(--ease) both}
  .body{flex:1;display:flex;align-items:center}
  .week{width:100%}
  @keyframes cardIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{opacity:0;transform:translateY(9px) scale(.97)}
                 60%{opacity:1;transform:translateY(-2px) scale(1.004)}100%{opacity:1;transform:none}}
  @keyframes inR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
  @keyframes inL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}

  .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel-2);
    border-bottom:1px solid var(--line);border-top:4px solid var(--red);padding:9px 12px}
  .mark{width:30px;height:30px;border-radius:6px;flex-shrink:0;border:1px solid var(--line);
    background:repeating-linear-gradient(135deg,var(--red) 0 6px,var(--panel) 6px 12px)}
  .hd h1{margin:0;font-size:18.5px;font-weight:800;letter-spacing:-.4px;line-height:1.1}
  .hd h1 span{color:var(--red)}
  .hd .sub{margin:2px 0 0;font-size:11.5px;color:var(--muted);font-weight:600}
  .nav{display:flex;align-items:center;gap:7px;margin-left:auto}
  .nav button{border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;
    border-radius:6px;box-shadow:0 3px 0 var(--bg);font-weight:700;
    transition:background .15s,transform .08s linear,box-shadow .08s linear}
  .nav button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--bg)}
  .nav .arw{width:32px;height:32px;font-size:18px;line-height:1;display:flex;align-items:center;justify-content:center}
  .nav .tdy{padding:7px 12px;font-size:12.5px;color:var(--ink)}
  .range{font-size:13px;font-weight:700;white-space:nowrap;color:var(--ink)}

  .body{padding:10px}
  .week{display:grid;grid-template-columns:repeat(var(--cols,5),minmax(0,1fr));gap:8px}
  .day{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;overflow:hidden;
    display:flex;flex-direction:column;animation:pop .38s var(--ease) backwards}
  .day.today{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
  .day.off{opacity:.62}
  .day h2{margin:0;padding:8px 10px;border-bottom:1px solid var(--line);display:flex;
    justify-content:space-between;align-items:baseline;gap:6px;flex-wrap:wrap}
  .day h2 .dow{font-size:15px;font-weight:800;letter-spacing:-.2px;min-width:0;overflow-wrap:anywhere}
  .day h2 .dt{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.5px}
  .day.today h2{background:var(--red);border-bottom-color:var(--red)}
  .day.today h2 .dow,.day.today h2 .dt{color:var(--ink)}
  .db{padding:10px;display:flex;flex-direction:column;gap:8px;flex:1}
  .feat{font-size:17px;font-weight:800;line-height:1.24;letter-spacing:-.2px;overflow-wrap:anywhere}
  .sides{display:flex;flex-direction:column;gap:4px}
  .sides span{font-size:13px;color:var(--ink);font-weight:500;line-height:1.3;padding-left:11px;position:relative}
  .sides span::before{content:'';position:absolute;left:0;top:.46em;width:5px;height:5px;background:var(--red)}
  .alts{margin-top:auto;font-size:11.5px;color:var(--muted);line-height:1.35;padding-top:8px;
    border-top:1px solid var(--line)}
  .none{font-size:13px;color:var(--muted)}
  .foot{margin:0;padding:0 12px 10px;font-size:11px;color:var(--muted);text-align:center}
  .msg{padding:36px 18px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
  .msg b{display:block;color:var(--ink);font-size:15px;margin-bottom:6px}

  .week.nav-next{animation:inR .32s var(--ease)}
  .week.nav-prev{animation:inL .32s var(--ease)}

  @media (hover:hover){ .nav button:hover{background:var(--line)} }
  @media (max-width:640px){
    .week{--cols:2}
    .hd h1{font-size:17px}
    .range{width:100%;text-align:center}
  }
  /* Two columns for as long as they hold a dish name: five stacked days make
     the card so tall that fitting it to the box shrinks the text to nothing. */
  @media (max-width:359px){ .week{--cols:1} }
  /* ══════════════════════════════════════════════════════════════════
     THEME — shared with the events calendar, countdowns and weather.
     This one is a card on a transparent page, so the ambient light lives
     inside the card rather than on the page behind it.
     ══════════════════════════════════════════════════════════════════ */
  :root{
    --spring:cubic-bezier(.34,1.56,.64,1);
    --red-glow:rgba(212,42,60,.34);
    --green:#3fa860;
    --r-lg:16px; --r-md:11px; --r-sm:8px;
  }
  .shell{border-radius:var(--r-lg);position:relative}
  .shell::before{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
    border-radius:inherit;
    background:
      radial-gradient(420px 260px at 18% 0%,rgba(212,42,60,.13),transparent 70%),
      radial-gradient(360px 240px at 92% 100%,rgba(63,127,214,.06),transparent 70%)}
  .hd,.body,.foot{position:relative;z-index:1}

  .mark{border-radius:9px;border-color:transparent;position:relative;overflow:hidden;
    background:linear-gradient(145deg,var(--red),var(--red-dark));
    box-shadow:0 3px 12px var(--red-glow)}
  .mark::after{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(135deg,rgba(255,255,255,.16) 0 5px,transparent 5px 10px)}

  .nav button{border-radius:var(--r-md);
    transition:background .18s,border-color .18s,transform .22s var(--spring),box-shadow .18s}
  .nav button:active{transform:translateY(2px) scale(.95)}
  @media (hover:hover){ .nav button:hover{background:var(--line);border-color:#55555e} }

  .day{border-radius:var(--r-md);
    transition:transform .22s var(--spring),border-color .18s,box-shadow .22s}
  .day.today{box-shadow:inset 0 0 0 1px var(--red),0 0 18px -6px var(--red-glow)}
  @media (hover:hover){
    .day:hover{transform:translateY(-2px);border-color:#55555e;box-shadow:0 10px 22px rgba(0,0,0,.3)}
  }

  /* A breathing green dot when the menu came down live. */
  .sub::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;
    background:var(--muted);margin-right:5px;vertical-align:1px}
  .sub.live::before{background:var(--green);animation:livePulse 2.4s ease-out infinite}
  @keyframes livePulse{0%{box-shadow:0 0 0 0 rgba(63,168,96,.5)}
                       70%{box-shadow:0 0 0 5px rgba(63,168,96,0)}
                       100%{box-shadow:0 0 0 0 rgba(63,168,96,0)}}

  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>

<div id="fit"><div class="wrap">
  <div class="shell">
    <div class="hd">
      <div class="mark" aria-hidden="true"></div>

        <button class="arw" id="next" aria-label="Next week">›</button>
        <button class="tdy" id="tdy">This week</button>
      </div>
    </div>
    <div class="body" id="view"></div>
    <p class="foot" id="foot"></p>
  </div>
</div></div>

  const pad=n=>n<10?'0'+n:''+n;
  const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
  const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
  const fromKey=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d);};

  function mondayOf(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
  // Saturday and Sunday belong to the week ahead.
  function schoolWeek(now){const m=mondayOf(now),w=now.getDay();return (w===0||w===6)?addDays(m,7):m;}

  const days=()=>(DATA.schools&&DATA.schools[school])||{};

  const realFood=list=>list.filter(i=>i&&!DIET_TAG.test(i.name||''));
  const itemsFor=k=>{const d=days()[k];return realFood((d&&d[meal])||[]);};
  function allMeals(){const s=new Set();Object.values(days()).forEach(m=>Object.keys(m).forEach(x=>s.add(x)));
    return [...s].sort((a,b)=>a==='Lunch'?-1:b==='Lunch'?1:a.localeCompare(b));}

  const ENTREE=/entr[ée]e|main|hot\s*food|featured/i, ALT=/\b(option|alternate)\b/i;
  // An item with no recognised category is usually the day's real dish, so it
  // may headline ahead of a standing "option". Mirrors fetch_menu.py.
  const KNOWN_TYPE=/entr|main|hot\s*food|featured|side|veg|fruit|grain|milk|condiment|drink|bever/i;
  const NOT_MAIN=new Set(('milk juice water lemonade tea coffee cocoa soda fruit fruits apple apples '
    +'applesauce banana bananas orange oranges mandarin mandarins grape grapes berry berries strawberry '
    +'strawberries blueberry blueberries melon watermelon cantaloupe kiwi pear pears peach peaches '
    +'pineapple plum plums raisin raisins craisins vegetable vegetables veggie veggies carrot carrots '
    +'celery broccoli cauliflower cucumber cucumbers condiment condiments ketchup mustard mayo '
    +'dressing ranch syrup butter jelly jam').split(' '));
  const MODIFIER=new Set(('fresh freshly assorted asst variety choice chilled cold hot sliced diced cut '
    +'whole baby mini small large cup cups bowl side sides serving of and or with w the a an low reduced '
    +'fat free nonfat skim unsweetened canned frozen seasonal local oz ct each individual packet pack').split(' '));
  function notAMain(name){
    const w=(name||'').toLowerCase().match(/[a-z]+/g)||[];
    if(!w.length) return true;
    if(!w.some(x=>NOT_MAIN.has(x))) return false;
    return w.every(x=>NOT_MAIN.has(x)||MODIFIER.has(x));
  }
  // Mirrors fetch_menu.py: a category that can never headline, and a
  // name-based tiebreak between a main and the starch next to it.
  const NEVER_HEAD=/fruit|milk|drink|bever|juice|dessert|condiment/i;
  const SIDE_HINT=new Set(('potato potatoes mash mashed fries tots tater tator rice roll rolls '
    +'bread breadstick breadsticks biscuit muffin cornbread chips crackers beans corn peas '
    +'broccoli carrots salad coleslaw slaw gravy sauce').split(' '));
  const MAIN_HINT=new Set(('chicken beef pork turkey ham fish shrimp meatball meatballs nugget '
    +'nuggets patty burger cheeseburger hamburger hotdog frank taco tacos nacho nachos pizza '
    +'sandwich wrap burrito quesadilla fajita fajitas lasagna spaghetti alfredo penne ziti mac '
    +'chili stir bowl sub gyro calzone pasta noodle noodles').split(' '));
  function looksLikeSide(name){
    const w=new Set((name||'').toLowerCase().match(/[a-z]+/g)||[]);
    for(const x of w) if(MAIN_HINT.has(x)) return false;
    for(const x of w) if(SIDE_HINT.has(x)) return true;
    return false;
  }
  function parts(items){
    if(!items.length) return {feat:null,sides:[],alts:[]};
    let feat=items.find(i=>i.featured);
    const isAlt=i=>i.alt!==undefined?i.alt:ALT.test(i.name);
    if(!feat) feat=items.find(i=>ENTREE.test(i.type||'')&&!isAlt(i))
                  ||items.find(i=>!isAlt(i)&&!NEVER_HEAD.test(i.type||'')&&!notAMain(i.name)&&!looksLikeSide(i.name))
                  ||items.find(i=>!isAlt(i)&&!NEVER_HEAD.test(i.type||'')&&!notAMain(i.name))
                  ||items.find(i=>ENTREE.test(i.type||''))
                  ||items.find(i=>!isAlt(i))||items[0];
    return {feat, sides:items.filter(i=>i!==feat&&!isAlt(i)), alts:items.filter(i=>i!==feat&&isAlt(i))};
  }
  // MealViewer sometimes sends names with the spaces missing
  // ("nationalSchoolLunchWeek", "Burger PlantBased"). Put the spaces back
  // where a lower-case letter runs straight into a capital, and start the
  // name with a capital.
  const unrun=t=>t.replace(/([a-z0-9])([A-Z])/g,'$1 $2')
                  .replace(/\s+/g,' ').trim()
                  .replace(/^[a-z]/,m=>m.toUpperCase());
  const plain=n=>unrun((n||'').replace(/\(\s*[A-Z]{1,3}\s*\)/g,' '));

  function render(){ paint(); queueFit(); }

  function paint(){
    const mon=monday||schoolWeek(new Date());
    $('range').textContent=`${fmt(mon,{month:'short',day:'numeric'})} – ${fmt(addDays(mon,4),{month:'short',day:'numeric'})}`;
    if(!Object.keys(days()).length){
      viewEl.innerHTML='<div class="msg"><b>Menu unavailable</b>'+
        (/^https?:/i.test(MENU_URL)?'It refreshes automatically each day.'
         :'Paste week-embed.html from the repository into Google Sites.')+'</div>';
      return;
    }
    const grid=document.createElement('div'); grid.className='week';
    // The fitter picks the column count: in a short box, more columns
    // means a shorter card and therefore bigger text.
    if(cols) grid.style.setProperty('--cols',cols);
    let shown=0;
    for(let i=0;i<5;i++){
      const d=addDays(mon,i), k=key(d), items=itemsFor(k);
      if(items.length) shown++;
      const card=document.createElement('div');
      card.className='day'+(k===TODAY?' today':'')+(items.length?'':' off');
      card.style.animationDelay=reduceMotion?'0ms':`${i*55}ms`;
      const h=document.createElement('h2');
      const a=document.createElement('span'); a.className='dow'; a.textContent=fmt(d,{weekday:'long'});
      const b=document.createElement('span'); b.className='dt';
      b.textContent=k===TODAY?'TODAY':fmt(d,{month:'short',day:'numeric'}).toUpperCase();
      h.append(a,b); card.appendChild(h);
      const body=document.createElement('div'); body.className='db';
      if(!items.length){
        const n=document.createElement('div'); n.className='none'; n.textContent='No menu posted';
        body.appendChild(n);
      }else{
        const {feat,sides,alts}=parts(items);
        const f=document.createElement('div'); f.className='feat'; f.textContent=plain(feat.name);
        body.appendChild(f);
        if(sides.length){
          const l=document.createElement('div'); l.className='sides';
          sides.forEach(x=>{const sp=document.createElement('span');sp.textContent=plain(x.name);l.appendChild(sp);});
          body.appendChild(l);
        }
        if(alts.length){
          const al=document.createElement('div'); al.className='alts';
          al.textContent='Also: '+alts.map(x=>plain(x.name).replace(/\s+Option$/i,'')).join(' · ');
          body.appendChild(al);
        }
      }
      card.appendChild(body); grid.appendChild(card);
    }
    viewEl.innerHTML=''; viewEl.appendChild(grid);
    $('foot').textContent = shown ? 'Menus can change due to product availability. Source: MealViewer.'
                                  : 'Nothing posted for this week yet.';
  }
  function replay(cls){
    if(reduceMotion) return;
    const g=viewEl.querySelector('.week'); if(!g) return;
    g.classList.remove('nav-next','nav-prev'); void g.offsetWidth; g.classList.add(cls);
  }

  $('prev').addEventListener('click',()=>{monday=addDays(monday||schoolWeek(new Date()),-7);render();replay('nav-prev');});
  $('next').addEventListener('click',()=>{monday=addDays(monday||schoolWeek(new Date()),7);render();replay('nav-next');});
  $('tdy').addEventListener('click',()=>{monday=schoolWeek(new Date());render();});

  // Fit the card to the embed box.
  //
  // Two things have to be true at once. The text must not change size when
  // you page between weeks -- so the scale is worked out from the FULLEST
  // week in the menu, never the one on screen. And the card has to fill the
  // box you drew in Sites, however tall you made it.
  //
  // The lever is the width the card is laid out at. Lay it out NARROWER than
  // the box and scaling it back up makes everything bigger; lay it out wider
  // and it shrinks. So: find the layout width where the fullest week, once
  // scaled, exactly fills the box. Every week then shares that one scale,
  // and the card is always the size of the embed.
  const MAX_ZOOM=1.8;                 // past this, a quiet week looks silly
  const MIN_COL=165;                  // layout px a column needs for a name
  let pending=false, measuring=false, plan={k:'',w:0,s:1,c:0}, heaviest=null, cols=0;

  function weekStarts(){
    const out=new Map();
    Object.keys(days()).forEach(k=>{
      if(!itemsFor(k).length) return;
      const m=mondayOf(fromKey(k)); out.set(key(m), m);
    });
    const cur=monday||schoolWeek(new Date()); out.set(key(cur), cur);
    return [...out.values()];
  }

  // Which week has the most in it. Found once per menu, then only that week
  // gets re-measured while the width is being searched.
  function findHeaviest(vw){
    const save=monday;
    let max=-1; heaviest=save;
    fitEl.style.width=vw+'px';
    weekStarts().forEach(w=>{
      monday=w; paint();
      const h=fitEl.scrollHeight;
      if(h>max){ max=h; heaviest=w; }
    });
    monday=save;
  }

  // For one column count, the narrowest layout width whose fullest week
  // still fits the box once scaled -- narrowest means largest text.
  function bestFor(vw,vh,c){
    cols=c;
    const at=w=>{ fitEl.style.width=w+'px'; paint(); return fitEl.scrollHeight||1; };
    const fits=w=> at(w)*(vw/w) <= vh;
    // Never lay a column out narrower than a dish name needs. Zooming in is
    // the same as laying out narrow, so without this floor the card fills
    // the box beautifully and splits "Hamburger" across two lines doing it.
    let lo=Math.max(vw/MAX_ZOOM, c*MIN_COL), hi=Math.max(lo*1.02,vw*4), W;
    if(fits(lo))       W=lo;          // fits even at full zoom
    else if(!fits(hi)) W=hi;          // nothing fits; the caller clamps
    else { for(let i=0;i<8;i++){ const mid=(lo+hi)/2; if(fits(mid)) hi=mid; else lo=mid; } W=hi; }
    const hT=at(W);
    return {w:W, c, s:Math.min(vw/W, vh/hT)};
  }

  function makePlan(vw,vh){
    const save=monday;
    if(heaviest===null) findHeaviest(vw);
    const wasCols=cols;
    monday=heaviest;

    // Five days split a few sensible ways. A tall narrow box wants one or
    // two columns; a short wide one wants five. Whichever leaves the text
    // biggest wins, which is the same as whichever scales up the most.
    //
    // With one exception: however much a split scales up, each column ends
    // up about (box width / columns) wide on screen, so too many columns
    // just chops dish names in half. Only splits that leave a column wide
    // enough to hold a name are considered.
    const options=[1,2,3,5].filter(c=>c===1||vw/c>=90);
    let best=null;
    options.forEach(c=>{
      const p=bestFor(vw,vh,c);
      if(!best || p.s>best.s+0.001) best=p;
    });

    cols=best.c; monday=save;
    if(!best.s||!isFinite(best.s)){ cols=wasCols; best={w:vw,c:wasCols,s:1}; }
    return {k:vw+'x'+vh, w:best.w, s:best.s, c:best.c};
  }

  // innerWidth/innerHeight are the reliable pair inside an embed frame:
  // they report the frame itself whatever document mode the host renders in.
  const vpW=()=>window.innerWidth||document.documentElement.clientWidth||0;
  const vpH=()=>window.innerHeight||document.documentElement.clientHeight||0;

  function fit(){
    pending=false;
    const vw=vpW(), vh=vpH();
    if(!vw||!vh) return;
    measuring=true;
    fitEl.style.transform='none';
    shellEl.style.minHeight='0px';

    const k=vw+'x'+vh;
    if(plan.k!==k) plan=makePlan(vw,vh);
    const {w:W,s}=plan;
    cols=plan.c;

    fitEl.style.width=W+'px';
    paint();                                   // back to the week on screen
    // Grow the card so that, once scaled, it is exactly the embed box --
    // minus the small gap around it, or the page gains a scrollbar.
    const gap=fitEl.scrollHeight-shellEl.offsetHeight;
    shellEl.style.minHeight=Math.max(0,vh/s-gap)+'px';
    const dx=Math.max(0,(vw-W*s)/2);
    fitEl.style.transform=`translateX(${dx}px) scale(${s})`;
    measuring=false;
  }
  // measuring guard: the paints inside makePlan() must not queue another fit.
  function queueFit(){ if(!pending && !measuring){ pending=true; requestAnimationFrame(fit); } }
  window.addEventListener('resize',queueFit);
  if(window.ResizeObserver) new ResizeObserver(queueFit).observe(fitEl);

  // Some hosts -- Google Sites among them -- settle the embed frame to its
  // final size after the page has already loaded, and don't always fire a
  // resize event when they do. Fitting to the size it had on the way past
  // leaves the card too small in the box, so watch for the box changing
  // under us. When nothing changed this costs two property reads, and the
  // cached plan means a real change re-measures only once.
  let seenBox='';
  function watchBox(){
    const k=vpW()+'x'+vpH();
    if(k!==seenBox && vpW() && vpH()){ seenBox=k; queueFit(); }
  }
  [100,350,900,2000,4000].forEach(t=>setTimeout(watchBox,t));
  setInterval(watchBox,1000);
  if(document.fonts&&document.fonts.ready)
    document.fonts.ready.then(()=>{ plan={k:'',w:0,s:1,c:0}; queueFit(); });

  function fmtWhen(iso){try{return new Date(iso).toLocaleString('en-US',{month:'short',day:'numeric'});}catch(e){return '';}}
  function adopt(p){
    DATA=p; school=Object.keys(DATA.schools||{})[0]||null;
    plan={k:'',w:0,s:1,c:0}; heaviest=null;  // new menu: fullest week may differ
    const ms=allMeals(); if(!ms.includes(meal)) meal=ms[0]||null;
    monday=schoolWeek(new Date());
    // If this week has nothing posted, show the nearest week that does.
    const has=w=>{for(let i=0;i<5;i++) if(itemsFor(key(addDays(w,i))).length) return true; return false;};
    if(!has(monday)){
      const ks=Object.keys(days()).filter(k=>itemsFor(k).length).sort();
      const nk=ks.find(k=>k>=TODAY)||ks[ks.length-1];
      if(nk) monday=mondayOf(fromKey(nk));
    }
    render();
  }
  async function load(){
    try{
      const r=await fetch(MENU_URL,{cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status);
      const j=await r.json();
      if(!j||!j.schools||!Object.keys(j.schools).length) throw new Error('no data');
      $('sub').classList.add('live');
      $('sub').textContent='Lincolnwood SD74 · updated '+fmtWhen(j.generated_at);
      adopt(j);
    }catch(e){
      console.warn('live menu unavailable:',e);
      $('sub').classList.remove('live');
      $('sub').textContent='Lincolnwood SD74 · saved menu';
      adopt(FALLBACK);
    }
  }
  render(); load();
})();
</script>
</body>
</html>
